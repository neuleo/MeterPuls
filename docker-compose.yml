version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meterpulse-backend
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8091:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meterpulse-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: meterpulse-network
